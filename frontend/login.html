<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>VIPER — Login</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🐍</text></svg>"/>
  <script src="https://cdn.jsdelivr.net/npm/@azure/msal-browser@3.14.0/lib/msal-browser.min.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: #0d0d0d;
      color: #ffffff;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .login-card {
      background: #1a1a1a;
      border: 1px solid #2a2a2a;
      border-radius: 12px;
      padding: 3rem;
      max-width: 480px;
      width: 100%;
      box-shadow: 0 0 40px rgba(220, 38, 38, 0.12);
      text-align: center;
    }

    .logo { font-size: 3rem; margin-bottom: 0.5rem; }

    .title {
      font-size: 2rem;
      font-weight: 700;
      color: #dc2626;
      letter-spacing: 4px;
      margin-bottom: 0.25rem;
    }

    .subtitle {
      font-size: 0.95rem;
      color: #aaaaaa;
      margin-bottom: 2.5rem;
      line-height: 1.5;
    }

    .btn-sso {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.75rem;
      width: 100%;
      padding: 0.9rem 1.5rem;
      background: #dc2626;
      color: #ffffff;
      border: none;
      border-radius: 8px;
      font-size: 1rem;
      font-weight: 600;
      font-family: 'Segoe UI', sans-serif;
      cursor: pointer;
      transition: background 0.2s;
    }

    .btn-sso:hover:not(:disabled) { background: #b91c1c; }
    .btn-sso:disabled { background: #555; cursor: not-allowed; }

    .ms-icon { width: 20px; height: 20px; flex-shrink: 0; }

    .bypass-input {
      width: 100%;
      background: #111;
      border: 1px solid #333;
      border-radius: 8px;
      padding: 0.85rem 1rem;
      color: #fff;
      font-size: 1rem;
      font-family: 'Segoe UI', sans-serif;
      margin-bottom: 1rem;
      outline: none;
      transition: border-color 0.2s;
    }
    .bypass-input:focus { border-color: #dc2626; }
    .bypass-input::placeholder { color: #555; }

    .status {
      margin-top: 1.25rem;
      font-size: 0.9rem;
      color: #aaaaaa;
      min-height: 1.2em;
    }

    .status.erro { color: #f87171; }
    .status.ok   { color: #4ade80; }

    .footer { margin-top: 2.5rem; font-size: 0.75rem; color: #555; }
  </style>
</head>
<body>

<div class="login-card">
  <div class="logo">🐍</div>
  <div class="title">VIPER</div>
  <p class="subtitle">Vulnerability Injection & Penetration<br>Evaluation for AI Resilience</p>

  <!-- SSO — localhost / HTTPS -->
  <div id="sso-section" style="display:none;">
    <button class="btn-sso" id="btnSSO" disabled onclick="entrar()">
      <svg class="ms-icon" viewBox="0 0 21 21" xmlns="http://www.w3.org/2000/svg">
        <rect x="1" y="1" width="9" height="9" fill="#f25022"/>
        <rect x="11" y="1" width="9" height="9" fill="#7fba00"/>
        <rect x="1" y="11" width="9" height="9" fill="#00a4ef"/>
        <rect x="11" y="11" width="9" height="9" fill="#ffb900"/>
      </svg>
      Entrar com conta Bemol
    </button>
  </div>

  <!-- Bypass — IP local / HTTP -->
  <div id="bypass-section" style="display:none;">
    <input type="text" id="nomeInput" class="bypass-input" placeholder="Seu nome completo" autocomplete="name"/>
    <button class="btn-sso" onclick="entrarBypass()">Entrar</button>
  </div>

  <div class="status" id="status"></div>

  <div class="footer">Acesso restrito ao time de Cibersegurança · BEMOL S/A</div>
</div>

<script>
  // ── Detecta contexto ──────────────────────────────────────────
  const isSeguro =
    window.location.hostname === 'localhost' ||
    window.location.hostname === '127.0.0.1' ||
    window.location.protocol === 'https:';

  if (isSeguro) {
    document.getElementById('sso-section').style.display = 'block';
  } else {
    document.getElementById('bypass-section').style.display = 'block';
  }

  // ── Helpers ───────────────────────────────────────────────────
  function setStatus(msg, tipo) {
    const el = document.getElementById('status');
    el.textContent = msg;
    el.className = 'status ' + (tipo || '');
  }

  function limparMsalStorage() {
    Object.keys(localStorage)
      .filter(k => k.startsWith('msal.') || k.startsWith('msal|'))
      .forEach(k => localStorage.removeItem(k));
  }

  // ── Bypass dev (rede local) ───────────────────────────────────
  window.entrarBypass = function () {
    const nome = document.getElementById('nomeInput').value.trim();
    if (!nome) { setStatus('Por favor, informe seu nome.', 'erro'); return; }

    const slug  = nome.toLowerCase()
      .normalize('NFD').replace(/[\u0300-\u036f]/g, '')
      .replace(/[^a-z0-9\s]/g, '').trim().replace(/\s+/g, '.');
    const email = slug + '@bemol.com.br';

    localStorage.setItem('viper_tecnico', nome);
    localStorage.setItem('viper_email',   email);
    window.location.href = '/viper';
  };

  document.getElementById('nomeInput')?.addEventListener('keydown', function(e) {
    if (e.key === 'Enter') entrarBypass();
  });

  // ── SSO (MSAL) — usa redirect (funciona em desktop e mobile) ──
  if (isSeguro) {
    (async () => {
      try {
        setStatus('Carregando configuração...');

        const res = await fetch('/api/auth-config');
        if (!res.ok) throw new Error('Falha ao carregar configuração de autenticação');
        const cfg = await res.json();

        if (!cfg.clientId || !cfg.tenantId) {
          setStatus('Configuração SSO ausente no servidor.', 'erro');
          return;
        }

        const msalConfig = {
          auth: {
            clientId:    cfg.clientId,
            authority:   'https://login.microsoftonline.com/' + cfg.tenantId,
            redirectUri: cfg.redirectUri
          },
          cache: {
            cacheLocation:          'localStorage',
            storeAuthStateInCookie: false
          }
        };

        const msalInstance = new msal.PublicClientApplication(msalConfig);
        const loginRequest = { scopes: ['User.Read'] };

        // ── Botão: inicia redirect (sem popup — funciona em mobile) ──
        window.entrar = async function () {
          const btn = document.getElementById('btnSSO');
          btn.disabled = true;
          setStatus('Redirecionando para login Microsoft...');
          try {
            await msalInstance.loginRedirect(loginRequest);
            // a página vai redirecionar — nada mais executa aqui
          } catch (erro) {
            console.error(erro);
            setStatus('Erro ao iniciar login: ' + erro.message, 'erro');
            btn.disabled = false;
          }
        };

        await msalInstance.initialize();

        // ── Processa retorno do redirect ──────────────────────────
        let resultado = null;
        try {
          resultado = await msalInstance.handleRedirectPromise();
        } catch (erro) {
          console.error('[MSAL] handleRedirectPromise erro:', erro);
          if (erro.errorCode === 'hash_empty_error' || erro.errorCode === 'no_cached_authority_error') {
            // estado corrompido — limpa e recarrega
            limparMsalStorage();
            window.location.reload();
            return;
          }
          setStatus('Erro ao processar login: ' + erro.message, 'erro');
          document.getElementById('btnSSO').disabled = false;
          return;
        }

        // Veio do redirect com sucesso
        if (resultado && resultado.account) {
          const conta = resultado.account;
          localStorage.setItem('viper_tecnico', conta.name || conta.username);
          localStorage.setItem('viper_email',   conta.username);
          setStatus('Autenticado. Redirecionando...', 'ok');
          window.location.href = '/viper';
          return;
        }

        // Já tinha sessão ativa
        const contas = msalInstance.getAllAccounts();
        if (contas.length > 0) {
          const conta = contas[0];
          localStorage.setItem('viper_tecnico', conta.name || conta.username);
          localStorage.setItem('viper_email',   conta.username);
          window.location.href = '/viper';
          return;
        }

        // Nenhuma sessão — habilita o botão
        document.getElementById('btnSSO').disabled = false;
        setStatus('');

      } catch (erro) {
        console.error(erro);
        setStatus('Erro ao inicializar SSO: ' + erro.message, 'erro');
        document.getElementById('btnSSO').disabled = false;
      }
    })();
  }
</script>

</body>
</html>
