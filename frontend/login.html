<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>VIPER — Login</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🐍</text></svg>"/>
  <script src="https://cdn.jsdelivr.net/npm/@azure/msal-browser@3.14.0/lib/msal-browser.min.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: #0d0d0d;
      color: #ffffff;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .login-card {
      background: #1a1a1a;
      border: 1px solid #2a2a2a;
      border-radius: 12px;
      padding: 3rem;
      max-width: 480px;
      width: 100%;
      box-shadow: 0 0 40px rgba(220, 38, 38, 0.12);
      text-align: center;
    }

    .logo { font-size: 3rem; margin-bottom: 0.5rem; }

    .title {
      font-size: 2rem;
      font-weight: 700;
      color: #dc2626;
      letter-spacing: 4px;
      margin-bottom: 0.25rem;
    }

    .subtitle {
      font-size: 0.95rem;
      color: #aaaaaa;
      margin-bottom: 2.5rem;
      line-height: 1.5;
    }

    .btn-sso {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.75rem;
      width: 100%;
      padding: 0.9rem 1.5rem;
      background: #dc2626;
      color: #ffffff;
      border: none;
      border-radius: 8px;
      font-size: 1rem;
      font-weight: 600;
      font-family: 'Segoe UI', sans-serif;
      cursor: pointer;
      transition: background 0.2s;
    }

    .btn-sso:hover:not(:disabled) { background: #b91c1c; }
    .btn-sso:disabled { background: #555; cursor: not-allowed; }

    .ms-icon { width: 20px; height: 20px; flex-shrink: 0; }

    .status {
      margin-top: 1.25rem;
      font-size: 0.9rem;
      color: #aaaaaa;
      min-height: 1.2em;
    }

    .status.erro { color: #f87171; }
    .status.ok   { color: #4ade80; }

    .footer { margin-top: 2.5rem; font-size: 0.75rem; color: #555; }
  </style>
</head>
<body>

<div class="login-card">
  <div class="logo">🐍</div>
  <div class="title">VIPER</div>
  <p class="subtitle">Vulnerability Injection & Penetration<br>Evaluation for AI Resilience</p>

  <button class="btn-sso" id="btnSSO" disabled onclick="entrar()">
    <svg class="ms-icon" viewBox="0 0 21 21" xmlns="http://www.w3.org/2000/svg">
      <rect x="1" y="1" width="9" height="9" fill="#f25022"/>
      <rect x="11" y="1" width="9" height="9" fill="#7fba00"/>
      <rect x="1" y="11" width="9" height="9" fill="#00a4ef"/>
      <rect x="11" y="11" width="9" height="9" fill="#ffb900"/>
    </svg>
    Entrar com conta Bemol
  </button>

  <div class="status" id="status">Carregando...</div>

  <div class="footer">Acesso restrito ao time de Cibersegurança · BEMOL S/A</div>
</div>

<script>
  const msalConfig = {
    auth: {
      clientId: "4a689be0-80a1-43f0-a183-062915598dac",
      authority: "https://login.microsoftonline.com/f10f91e5-f905-48aa-8c4c-a68d0ae5f6ec",
      redirectUri: "http://localhost:8001/viper"
    },
    cache: {
      cacheLocation: "localStorage",
      storeAuthStateInCookie: false
    }
  };

  const msalInstance = new msal.PublicClientApplication(msalConfig);

  const loginRequest = { scopes: ["User.Read"] };

  function setStatus(msg, tipo) {
    const el = document.getElementById("status");
    el.textContent = msg;
    el.className = "status " + (tipo || "");
  }

  async function entrar() {
    const btn = document.getElementById("btnSSO");
    btn.disabled = true;
    setStatus("Abrindo login Microsoft...");

    try {
      const resultado = await msalInstance.loginPopup(loginRequest);
      const conta = resultado.account;

      localStorage.setItem("viper_tecnico", conta.name || conta.username);
      localStorage.setItem("viper_email", conta.username);

      setStatus("Autenticado como " + conta.name + ". Redirecionando...", "ok");

      setTimeout(() => { window.location.href = "/viper"; }, 800);

    } catch (erro) {
      console.error(erro);
      if (erro.errorCode === "user_cancelled") {
        setStatus("Login cancelado.", "erro");
      } else {
        setStatus("Erro ao autenticar: " + erro.message, "erro");
      }
      btn.disabled = false;
    }
  }

(async () => {
    try {
      await msalInstance.initialize();
      
      // Processa o redirect do logout antes de qualquer coisa
      await msalInstance.handleRedirectPromise();

      const contas = msalInstance.getAllAccounts();
      if (contas.length > 0) {
        const conta = contas[0];
        localStorage.setItem("viper_tecnico", conta.name || conta.username);
        localStorage.setItem("viper_email", conta.username);
        window.location.href = "/viper";
        return;
      }

      document.getElementById("btnSSO").disabled = false;
      setStatus("");
    } catch (erro) {
      document.getElementById("btnSSO").disabled = false;
      setStatus("");
    }
  })();
</script>

</body>
</html>
